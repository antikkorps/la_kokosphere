[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirections
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Fonctions Netlify
[functions]
  directory = "netlify/functions"

# Variables d'environnement pour les fonctions
[functions."cleanup-consent-stats"]
  included_files = ["node_modules/@sanity/**"]

# Configuration pour le nettoyage automatique (cron job)
# À configurer dans le dashboard Netlify :
# - Aller dans Functions > Scheduled Functions
# - Créer un cron job qui appelle /api/cleanup-consent-stats
# - Fréquence recommandée : tous les jours à 2h du matin (0 2 * * *)


[context.production.environment]
  NETLIFY_USE_YARN = "false"



# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    # Seule CSP du site : Netlify ignorait celle de public/_headers. Toute
    # origine ajoutée ici doit correspondre à une ressource réelle, voir
    # tests/csp.test.js.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://calendly.com https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io https://api.dicebear.com; connect-src 'self'; frame-src https://calendly.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Access-Control-Allow-Origin = "*"

# Cache pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les images
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable" 
